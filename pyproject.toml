[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "commentdraft"
version = "0.1.0"
description = "Triage social-media comments from a CSV and draft grounded replies for a human to review."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Ab-Romia" }]
keywords = ["comments", "triage", "moderation", "csv", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications",
  "Topic :: Text Processing :: Filters",
]
dependencies = ["openai>=1.40"]

[project.urls]
Homepage = "https://github.com/Ab-Romia/commentdraft"
Repository = "https://github.com/Ab-Romia/commentdraft"
Issues = "https://github.com/Ab-Romia/commentdraft/issues"
Changelog = "https://github.com/Ab-Romia/commentdraft/releases"

[project.optional-dependencies]
pdf = ["pymupdf>=1.24.3"]

[project.scripts]
commentdraft = "commentdraft.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "pyright>=1.1.380", "pre-commit>=4.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/commentdraft"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "TID"]
ignore = [
  # Reason: length is a formatting concern and the formatter owns it. Enforcing it
  # twice only produces awkward wraps in comments that explain a decision.
  "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["commentdraft"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "parents"

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not live\""
xfail_strict = true
filterwarnings = ["error"]
markers = [
  "live: hits a real network endpoint (OpenRouter's model list); excluded from the default run, opt in with `pytest -m live`",
]

[tool.codespell]
# CSVs are operator data, not maintained prose: comment exports carry real usernames
# and real language mixes, including words an English dictionary flags as typos.
# ./notes is the planning tree: never shipped, never committed, not held to this
# repository's prose standard.
skip = "./.git,./out,./.venv,./uv.lock,./docs/img,./notes,*.csv"
# Each entry below is a deliberate string, not a typo left uncaught:
# unparseable: a valid spelling variant used in prose and code comments.
# summar: a stem a test asserts as a substring, not a word on its own.
# integrat: the regex fragment covering integrate/integration in a forbidden-claim
#   list, not a word on its own.
# caf: half of "cafe", built with chr() in a test so that file stays ascii itself.
# responde: Spanish, in a worked example that demonstrates a non-English reply.
# notin: ast.NotIn, the node class for `x not in y`, named in a guarantee test.
# acount: Meta's typo, inside a quotation of Meta's own reference page in
#   docs/platforms/instagram.md, disclosed at the quote and reproduced as read. A
#   spell checker does not get to edit a primary source any more than the
#   forbidden-claims lint does.
ignore-words-list = "nd,ba,unparseable,summar,integrat,caf,responde,notin,acount"
